name: CI

# Lints and tests the workspace, builds fully static musl binaries of gswifi
# for three CPU families (plus an experimental mipsel one), packages them for
# OpenWrt (ipk for OpenWrt <= 24.10, apk for >= 25.12, installed and exercised
# in the official OpenWrt rootfs) and for other Linux distributions (deb and
# rpm, installed in Debian, Ubuntu, Fedora and Rocky Linux containers).
# Pushing a tag v<Cargo.toml version> publishes a GitHub release with
# everything.
#
# Every job body is a script in ci/ that also runs on a developer machine:
# see ci/README.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

# Caches (Swatinem/rust-cache) are written by pushes to main only, and a tag
# build does not restore any (lookup-only): what gets released is built from
# scratch.

env:
  CARGO_TERM_COLOR: always
  # One toolchain for every job, so that rustfmt and clippy say the same here
  # as on the machine that last ran them. Bump it deliberately (ci/README.md).
  RUST_TOOLCHAIN: 1.96.1
  # The mipsel target is tier 3: no prebuilt std, so nightly with -Zbuild-std.
  RUST_NIGHTLY: nightly-2026-11-19
  # The static libpcap of the cross images is pinned in Cross.toml and
  # ci/build-libpcap.sh, cross itself (and its checksum) in ci/install-cross.sh.

jobs:
  lint:
    name: lint (scripts, LuCI)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell scripts
        run: sh ci/lint-shell.sh

      - name: LuCI views and JSON
        if: ${{ !cancelled() }}
        run: node ci/check-luci.js openwrt/luci-app-gswifi

      - name: Versions agree (Cargo.toml, OpenWrt Makefiles, libpcap pins)
        if: ${{ !cancelled() }}
        run: |
          sh ci/version.sh
          script=$(sed -n 's/^version=//p' ci/build-libpcap.sh)
          if ! grep -q "\"LIBPCAP_VER=$script\"" Cross.toml; then
            echo "::error file=Cross.toml::LIBPCAP_VER differs from libpcap $script in ci/build-libpcap.sh"
            exit 1
          fi

  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt
          rustup default "$RUST_TOOLCHAIN"

      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.ref_type == 'tag' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} and libpcap
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpcap-dev >/dev/null

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.ref_type == 'tag' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The nft_syntax test skips validation when nft lacks CAP_NET_ADMIN
      # (as on the runner); the nft job validates every ruleset as root.
      - run: cargo test --workspace --locked

  nft:
    name: nftables rulesets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Keep in step with the matrix of the openwrt job.
      OPENWRT_RELEASES: 23.05.5 24.10.8 25.12.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.ref_type == 'tag' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate every ruleset variant
        run: sh ci/nft-dump.sh "$RUNNER_TEMP/nft"

      - name: Check them with the nft of each OpenWrt release
        run: |
          rc=0
          for release in $OPENWRT_RELEASES; do
            echo "::group::OpenWrt $release"
            image=$(sh ci/openwrt-rootfs.sh "$release")
            if ! docker run --rm --cap-add NET_ADMIN -v "$PWD/ci:/ci:ro" -v "$RUNNER_TEMP/nft:/nft:ro" \
                "$image" sh /ci/nft-check.sh /nft; then
              rc=1
              failed="${failed:-} $release"
            fi
            echo "::endgroup::"
          done
          if [ "$rc" != 0 ]; then
            echo "::error::nft rejected a generated ruleset on OpenWrt${failed}"
          fi
          exit "$rc"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: nft-rulesets
          path: ${{ runner.temp }}/nft/*.nft
          if-no-files-found: warn
          retention-days: 7

  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      cargo: ${{ steps.v.outputs.cargo }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: v
        name: Work out the version (a tag must match Cargo.toml)
        run: sh ci/version.sh | tee -a "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.family }})
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # runner: what the release binary is smoke-run with on the x86-64
        # runner (qemu-user for the foreign targets).
        include:
          - family: x86_64
            target: x86_64-unknown-linux-musl
            runner: ''
          - family: aarch64
            target: aarch64-unknown-linux-musl
            runner: qemu-aarch64-static
          # Soft-float, so the one binary runs on every ARMv7 OpenWrt target,
          # including the ones without an FPU (bcm53xx): it is run on a CPU
          # model that has none, where hard-float code dies of SIGILL.
          - family: armv7
            target: armv7-unknown-linux-musleabi
            runner: qemu-arm-static -cpu cortex-a9,vfp=off,vfp-d32=off,neon=off
    env:
      FAMILY: ${{ matrix.family }}
      TARGET: ${{ matrix.target }}
      RUNNER: ${{ matrix.runner }}
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_VERSION: ${{ needs.version.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} and cross
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          sh ci/install-cross.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.ref_type == 'tag' }}
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The first cross call also builds the image with the static libpcap
      # (Cross.toml, ci/build-libpcap.sh).
      - name: Build
        run: cross build --release --locked -p gswifi --target "$TARGET"

      - name: Test (under qemu for foreign targets)
        run: cross test --workspace --locked --target "$TARGET"

      - name: Check the release binary
        run: |
          if [ -n "$RUNNER" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq qemu-user-static >/dev/null
          fi
          sh ci/check-binary.sh "target/$TARGET/release/gswifi" "$CARGO_VERSION" "$RUNNER"

      - name: Archive
        run: |
          mkdir out
          cp "target/$TARGET/release/gswifi" "out/gswifi-$FAMILY"

          d=gswifi-$VERSION-$FAMILY-linux-musl
          mkdir "$d"
          cp "target/$TARGET/release/gswifi" LICENSE README.md "$d/"
          tar --owner=0 --group=0 --numeric-owner -czf "out/$d.tar.gz" "$d"
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.family }}
          path: out/*
          if-no-files-found: error

  # Experimental and non-blocking. The original GSWIFI routers are MT7621:
  # mipsel, no FPU. Rust has that target in tier 3, without a prebuilt std, so
  # this takes a nightly toolchain and -Zbuild-std (Cross.toml). Nothing waits
  # for the result; a release attaches the tarball when there is one.
  mipsel:
    name: build (mipsel, experimental)
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    env:
      TARGET: mipsel-unknown-linux-musl
      VERSION: ${{ needs.version.outputs.version }}
      CARGO_VERSION: ${{ needs.version.outputs.cargo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_NIGHTLY }} with the std sources, and cross
        run: |
          rustup toolchain install "$RUST_NIGHTLY" --profile minimal --component rust-src
          sh ci/install-cross.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          lookup-only: ${{ github.ref_type == 'tag' }}
          key: mipsel-unknown-linux-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cross "+$RUST_NIGHTLY" build --release --locked -p gswifi --target "$TARGET"

      - name: Check the release binary
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static >/dev/null
          # 24Kc: MIPS32r2 without an FPU, like the 1004Kc of the MT7621.
          sh ci/check-binary.sh "target/$TARGET/release/gswifi" "$CARGO_VERSION" "qemu-mipsel-static -cpu 24Kc"

      - name: Archive
        run: |
          mkdir out
          d=gswifi-$VERSION-mipsel-linux-musl
          mkdir "$d"
          cp "target/$TARGET/release/gswifi" LICENSE README.md "$d/"
          tar --owner=0 --group=0 --numeric-owner -czf "out/$d.tar.gz" "$d"
          ls -l out

      # Not named build-*: the packaging jobs must not pick it up.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experimental-mipsel
          path: out/*
          if-no-files-found: error

  openwrt:
    name: openwrt ${{ matrix.release }} (${{ matrix.format }})
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep the releases in step with OPENWRT_RELEASES of the nft job.
        # ci/package.sh makes the same ipk files for every opkg release, so
        # only one of the two ipk jobs uploads them.
        include:
          - format: ipk
            release: '23.05.5'
            upload: false
          - format: ipk
            release: '24.10.8'
            upload: true
          - format: apk
            release: '25.12.6'
            upload: true
    env:
      FORMAT: ${{ matrix.format }}
      RELEASE: ${{ matrix.release }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: bin
          merge-multiple: true

      - name: Import the OpenWrt ${{ matrix.release }} x86-64 rootfs
        run: sh ci/openwrt-rootfs.sh "$RELEASE"

      - name: Build ${{ matrix.format }} packages
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          mkdir packages
          if [ "$FORMAT" = ipk ]; then
            sh ci/package.sh ipk "$VERSION" bin packages
          else
            # apk packages are made with `apk mkpkg`, which the apk of the
            # OpenWrt rootfs is built without; Alpine's apk-tools 3 has it.
            docker run --rm -v "$PWD:/src" -w /src -e SOURCE_DATE_EPOCH \
              alpine:3.24 sh ci/package.sh apk "$VERSION" bin packages
          fi
          ls -l packages

      - name: Install and test on OpenWrt ${{ matrix.release }}
        run: |
          docker run --rm -v "$PWD/packages:/pkgs:ro" -v "$PWD/ci:/ci:ro" "openwrt:$RELEASE" \
            sh /ci/openwrt-test.sh "$FORMAT" /pkgs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ matrix.upload }}
        with:
          name: packages-${{ matrix.format }}
          path: packages/*
          if-no-files-found: error

  linux:
    name: linux (deb, rpm)
    needs: [version, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: bin
          merge-multiple: true

      - name: Build deb and rpm packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm >/dev/null
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export SOURCE_DATE_EPOCH
          mkdir packages
          sh ci/linux-package.sh deb "$VERSION" bin packages
          sh ci/linux-package.sh rpm "$VERSION" bin packages
          ls -l packages

      - name: Install and test on Debian, Ubuntu, Fedora and Rocky Linux
        run: |
          # A current and an older release of each package format.
          for t in deb:debian:stable deb:ubuntu:20.04 rpm:fedora:latest rpm:rockylinux:8; do
            fmt=${t%%:*} image=${t#*:}
            echo "::group::$image"
            docker run --rm -v "$PWD/packages:/pkgs:ro" -v "$PWD/ci:/ci:ro" "$image" \
              sh /ci/linux-test.sh "$fmt" /pkgs
            echo "::endgroup::"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-linux
          path: packages/*
          if-no-files-found: error

  release:
    # Waits for mipsel, to attach its tarball, but does not need it to pass:
    # every other job is asked for by name.
    needs: [lint, fmt, clippy, test, nft, version, build, mipsel, openwrt, linux]
    if: >-
      ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v')
      && needs.lint.result == 'success' && needs.fmt.result == 'success'
      && needs.clippy.result == 'success' && needs.test.result == 'success'
      && needs.nft.result == 'success' && needs.version.result == 'success'
      && needs.build.result == 'success' && needs.openwrt.result == 'success'
      && needs.linux.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          mkdir dist
          cp artifacts/build-*/*.tar.gz artifacts/packages-*/* dist/
          # Only there when the experimental build worked.
          cp artifacts/experimental-*/*.tar.gz dist/ 2>/dev/null || true
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
          # Fails when a package the notes promise is not there.
          sh ci/release-notes.sh "$VERSION" dist > notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # v1.0.0-rc1 and the like are marked as pre-releases.
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "Open GSWIFI $TAG" \
            --notes-file notes.md --generate-notes "${flags[@]}"

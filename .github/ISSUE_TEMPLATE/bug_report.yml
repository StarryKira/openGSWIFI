name: Bug 报告
description: 程序出错、崩溃或行为和文档不一致
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        贴配置和日志之前，请先删掉账号、密码、学号、MAC 地址等个人信息。
        不要贴 `--trace` 的输出：里面有完整的认证报文。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你看到的现象，以及你期望的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 在 LuCI 里设置……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gswifi 版本
      description: "`gswifi --version` 的输出"
      placeholder: gswifi 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 系统与架构
      description: OpenWrt 版本和架构，或其他 Linux 发行版
      placeholder: OpenWrt 24.10.8, aarch64
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: 认证方式
      description: "`driver` 的值，与此无关可留空"
      placeholder: ruijie
  - type: textarea
    id: config
    attributes:
      label: 配置（已脱敏）
      description: 相关的 UCI 配置或 config.toml 片段
      render: toml
  - type: textarea
    id: logs
    attributes:
      label: 日志（已脱敏）
      description: "`logread -e gswifi` 或 `journalctl -u gswifi` 中出错前后的几十行"
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我已删掉账号、密码等个人信息，也没有贴 `--trace` 的输出
          required: true
